name: Bug report
description: Report something that is broken or not working as expected
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or commands that reproduce the issue.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, browser/runtime, version"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, related links.
